<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>見た目の比較 — ONE LIGHT-DAY</title>
    <!--
      第 2 段階の比較ページ(開発用。本番のビルドには入れない)。
      同じ画面に、見た目の案 A / B / C を当てて並べる。案の中身は src/looks.css。
      開き方: npm run dev のあと http://localhost:5180/compare.html
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #101216;
        --panel: #181b21;
        --line: #2c313b;
        --ink: #e8e4d8;
        --dim: #9aa0ab;
        --accent: #d8a84a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.7 'Hiragino Sans', 'Yu Gothic', Meiryo, system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      .lead {
        margin: 0;
        color: var(--dim);
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .group[hidden] {
        display: none;
      }
      .group > span {
        color: var(--dim);
        font-size: 12px;
        margin-right: 2px;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 4px 12px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      main {
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: none;
      }
      figcaption b {
        color: var(--accent);
        margin-right: 8px;
      }
      figcaption span {
        color: var(--dim);
        font-size: 13px;
      }
      iframe {
        display: block;
        border: 1px solid var(--line);
        background: #000;
      }
      .phones iframe {
        width: 390px;
        height: 780px;
      }
      .single figure {
        flex: 1;
        min-width: 0;
      }
      .single iframe {
        width: 100%;
        height: min(76vh, 60vw);
      }
      .single figure[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>見た目の比較</h1>
      <p class="lead">
        同じ画面に3つの案を当てています。画面の中は実際に操作できます(見回す、時間軸、向くボタン)。色と字体は、選んだ案をもとに細かく直せます。
      </p>
      <div class="controls">
        <div class="group" id="layout">
          <span>並べ方</span>
          <button data-value="phones">スマホの縦を3つ並べる</button>
          <button data-value="single">PCの大きさで1つずつ</button>
        </div>
        <div class="group" id="pick" hidden>
          <span>案</span>
          <button data-value="a">A</button>
          <button data-value="b">B</button>
          <button data-value="c">C</button>
        </div>
        <div class="group" id="scene">
          <span>場面</span>
          <button data-value="pbd">ペイル・ブルー・ドット</button>
          <button data-value="today">今日の視界</button>
          <button data-value="jupiter">木星</button>
          <button data-value="overview81">引きの眺め(1981年)</button>
          <button data-value="overview">引きの眺め(今日)</button>
        </div>
        <div class="group" id="stars">
          <span>星の数</span>
          <button data-value="base">肉眼で見える約9千個</button>
          <button data-value="deep">8等までの約4万個</button>
        </div>
      </div>
    </header>
    <main>
      <div class="row phones" id="row">
        <figure data-style="a">
          <figcaption><b>A 計器盤</b><span>幅の広い欧文の題字、等幅の数字、金の細い線、四隅の括弧</span></figcaption>
          <iframe title="案A 計器盤"></iframe>
        </figure>
        <figure data-style="b">
          <figcaption><b>B 印刷物</b><span>幾何学的な欧文、生成りの文字、朱に近い橙の差し色、合わせマーク</span></figcaption>
          <iframe title="案B 印刷物"></iframe>
        </figure>
        <figure data-style="c">
          <figcaption><b>C 端末</b><span>ドットの文字、琥珀色の単色、細い枠、強めの光</span></figcaption>
          <iframe title="案C 端末"></iframe>
        </figure>
      </div>
    </main>
    <script>
      const SCENES = {
        pbd: 't=1990-02-14T04:48:00Z&view=voyager&look=earth',
        today: 'view=voyager&look=sun',
        jupiter: 't=1979-03-05T12:04:00Z&view=voyager&look=jupiter',
        overview81: 't=1981-01-01T00:00:00Z&view=overview',
        overview: 'view=overview',
      };
      const state = { layout: 'phones', pick: 'a', scene: 'pbd', stars: 'base' };
      const row = document.getElementById('row');
      const figures = [...row.querySelectorAll('figure')];

      function render(reload) {
        row.className = 'row ' + state.layout;
        document.getElementById('pick').hidden = state.layout !== 'single';
        for (const figure of figures) {
          const style = figure.dataset.style;
          const visible = state.layout === 'phones' || state.pick === style;
          figure.hidden = !visible;
          const frame = figure.querySelector('iframe');
          const src = './?style=' + style + '&' + SCENES[state.scene] + (state.stars === 'deep' ? '&stars=deep' : '');
          // 見えていない案は読み込まない(3D を 3 つ同時に動かすのは、並べている時だけにする)
          if (!visible) frame.removeAttribute('src');
          else if (reload || frame.getAttribute('src') !== src) frame.setAttribute('src', src);
        }
        for (const id of ['layout', 'pick', 'scene', 'stars']) {
          for (const b of document.querySelectorAll('#' + id + ' button')) {
            b.setAttribute('aria-pressed', String(state[id] === b.dataset.value));
          }
        }
      }

      for (const id of ['layout', 'pick', 'scene', 'stars']) {
        document.getElementById(id).addEventListener('click', (event) => {
          const b = event.target.closest('button');
          if (!b) return;
          state[id] = b.dataset.value;
          render(false);
        });
      }
      // 1つずつ見る時は、キーボードの 1 / 2 / 3 で案を切り替える
      window.addEventListener('keydown', (event) => {
        const pick = { 1: 'a', 2: 'b', 3: 'c' }[event.key];
        if (!pick || state.layout !== 'single') return;
        state.pick = pick;
        render(false);
      });
      render(true);
    </script>
  </body>
</html>
