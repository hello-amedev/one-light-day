# GitHub Pages へ公開する。手動でだけ動く(push では動かさない)。
# 公開の前に docs/publish.md の手順を済ませる。リポジトリが非公開のうちは動かさない。
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 作る段(検査とビルドと公開用のファイルの用意)と公開する段を分ける(GitHub の標準の形)。
# 1 つの段で続けて行うと、上げた直後の公開用のファイルを公開の手順が見つけられず失敗することが続いた(2026-11-22 に 5 回)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
